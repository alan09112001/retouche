<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test connexion Gemini</title>
  <style>
    body{font:15px system-ui,-apple-system,sans-serif;margin:0;padding:18px;background:#0f172a;color:#e2e8f0}
    h2{margin:0 0 12px}
    input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #334155;background:#1e293b;color:#fff;width:100%;box-sizing:border-box;margin:6px 0}
    button{background:#0ea5e9;border:0;font-weight:600;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;background:#000;color:#0f0;padding:12px;border-radius:9px;font:12px/1.5 ui-monospace,monospace;margin-top:14px}
    .muted{color:#64748b;font-size:13px}
  </style>
</head>
<body>
  <h2>🔧 Test connexion Gemini</h2>
  <p class="muted">Ouvre ce fichier sur l'appareil/réseau qui pose problème, colle ta clé, lance les tests.</p>
  <input id="k" type="password" placeholder="Clé API Gemini" autocomplete="off">
  <button id="go">Lancer les tests</button>
  <pre id="o"></pre>
  <script>
    const o = document.getElementById("o");
    const log = (...a) => { o.textContent += a.join(" ") + "\n"; };

    document.getElementById("go").addEventListener("click", async () => {
      o.textContent = "";
      const key = document.getElementById("k").value.trim();
      if(!key){ log("⛔ Mets ta clé d'abord."); return; }

      // ① GET simple — NE déclenche PAS de préflight CORS
      log("① GET /models (requête simple)…");
      try{
        const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + encodeURIComponent(key));
        log("   → HTTP", r.status);
        const j = await r.json();
        log("   →", r.ok ? ("OK ✅ — " + (j.models?.length||0) + " modèles") : (j.error?.message || "erreur"));
      }catch(e){ log("   ⛔ ÉCHEC:", e.name, "—", e.message); }

      // ② POST JSON — déclenche un préflight CORS (OPTIONS)
      log("\n② POST generateContent (préflight CORS)…");
      try{
        const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(key), {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ contents:[{ parts:[{ text:"dis bonjour" }] }] })
        });
        log("   → HTTP", r.status);
        const j = await r.json();
        log("   →", r.ok ? "OK ✅ — ton réseau accepte les POST" : (j.error?.message || "erreur"));
      }catch(e){ log("   ⛔ ÉCHEC:", e.name, "—", e.message); }

      log("\n— Interprétation —");
      log("• ① OK + ② OK  → le réseau marche (le souci venait d'ailleurs).");
      log("• ① OK + ② KO  → le préflight POST est bloqué (proxy / bloqueur / MDM).");
      log("• ① KO + ② KO  → tout Google est bloqué sur cet appareil/navigateur.");
    });
  </script>
</body>
</html>
